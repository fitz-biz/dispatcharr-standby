name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The image compiles a plugin from a moving upstream branch and installs
  # distro packages, so rebuild weekly to pick up security updates.
  schedule:
    - cron: "17 5 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only linux/amd64. The build compiles a Rust plugin, and doing that for
      # arm64 under QEMU emulation takes the better part of an hour for a
      # platform nothing here runs on.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile already fails the build if fallbacksrc is missing, but
      # that only proves the plugin loads. This proves the thing actually
      # serves.
      - name: Smoke test
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker pull "$IMAGE"
          fi
          docker run -d --name smoke -p 8099:8099 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8099/healthz >/dev/null 2>&1; then
              echo "healthz ok after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "sidecar never became healthy"; docker logs smoke; exit 1
            fi
            sleep 1
          done
          echo "--- startup log (shows which encoder was selected) ---"
          docker logs smoke 2>&1 | head -5
          docker rm -f smoke >/dev/null
